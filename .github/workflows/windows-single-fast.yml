name: Windows single-file validation
on:
  push:
    branches:
      - 'codex/desktop-test-build-*'
permissions:
  contents: read
  actions: read
jobs:
  portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      # The GUI/core are unchanged from this already-validated run. The full
      # desktop workflow also rebuilds everything from the current commit.
      - uses: actions/download-artifact@v4
        with:
          name: windows-x86_64
          run-id: 40636936035
          github-token: ${{ github.token }}
          path: build/artifacts
      - name: Package and validate single-file executable
        shell: pwsh
        run: ./scripts/build-windows-single.ps1 -BundleArchive build/artifacts/xiaomi-lightbar-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-single-exe
          path: build/artifacts/Xiaomi-Lightbar-Windows-x86_64.exe
          if-no-files-found: error
