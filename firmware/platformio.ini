; PlatformIO project for RF-NANO (ATmega328P + built-in NRF24L01)
; Flash: pio run -t upload

[env:nanoatmega328new]
platform = atmelavr
board = nanoatmega328new
framework = arduino
monitor_speed = 115200
lib_deps = nrf24/RF24 @ ^1.4.8

; If your RF-NANO has the old bootloader, use nanoatmega328 instead:
; board = nanoatmega328
